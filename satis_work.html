<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>근무 만족도 조사</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">근무 만족도 조사</h2>

    <form id="satisfactionForm">
        <div class="mb-3">
            <label for="satisfactionName" class="form-label">직원 성명</label>
            <input type="text" class="form-control" id="satisfactionName" name="satisfactionName" required>
        </div>

        <h4 class="mt-4">조사항목</h4>

        <div class="mb-3">
            <label class="form-label">직무적성 정도</label>
            <select class="form-select" name="직무적성 정도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">직위 및 직책의 적합성 정도</label>
            <select class="form-select" name="직위 및 직책의 적합성 정도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">급여 보상의 적정 정도</label>
            <select class="form-select" name="급여 보상의 적정 정도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">복리후생 만족도</label>
            <select class="form-select" name="복리후생 만족도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">조합 분위기 만족도</label>
            <select class="form-select" name="조합 분위기 만족도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">자기개발 기회 부여 정도</label>
            <select class="form-select" name="자기개발 기회부여 정도" required>
                <option value="">선택</option>
                <option value="A">매우 만족</option>
                <option value="B">만족</option>
                <option value="C">보통</option>
                <option value="D">불만족</option>
                <option value="E">매우 불만족</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">조합에 바라는 점</label>
            <textarea class="form-control" id="expectation" name="expectation" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">제출</button>
    </form>

    <p id="satisfactionResponseMessage" class="mt-3"></p>

    <script>
        document.getElementById("satisfactionForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch("https://script.google.com/macros/s/AKfycbz9ZtKFnmuqmRGa2N5TYr0gVZBMcosI5J4o3etq5uG9JFCqgU_h_qX8Km0HSG5Qv9M1/exec", {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById("satisfactionResponseMessage").textContent = "근무 만족도 조사가 성공적으로 제출되었습니다!";
                event.target.reset();
            }).catch(error => {
                document.getElementById("satisfactionResponseMessage").textContent = "제출 중 오류가 발생했습니다.";
            });
        });
    </script>
    
</body>
</html>
