<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직원 평가</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2 class="mb-4">직원 평가 제출</h2>
    
    <form id="evaluationForm">
        <div class="mb-3">
            <label for="name" class="form-label">직원 이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        
        <div class="mb-3">
            <label for="employeeId" class="form-label">직급/직책</label>
            <select class="form-select" id="employeeId" name="employeeId" required>
                <option value="">선택</option>
                <option value="4급/상무">4급 상무</option>
                <option value="5급/부장">5급 부장</option>
                <option value="6급/차장">6급 차장</option>
                <option value="6급/과장">6급 과장</option>
              </select>
        </div>

        <h4 class="mt-4">평가 항목</h4>

        <div class="mb-3">
            <label class="form-label">업무 숙련도</label>
            <select class="form-select" name="업무 숙련도">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">창의성과 문제 해결 능력</label>
            <select class="form-select" name="창의성과 문제 해결 능력">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">업무 실적</label>
            <select class="form-select" name="업무 실적">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">규정 및 절차 준수</label>
            <select class="form-select" name="규정 및 절차 준수">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">고객 응대 및 서비스 마인드</label>
            <select class="form-select" name="고객 응대 및 서비스 마인드">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">조직 융화 및 협업</label>
            <select class="form-select" name="조직 융화 및 협업">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">책임감 및 업무 태도</label>
            <select class="form-select" name="책임감 및 업무 태도">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">리더십 및 주도성</label>
            <select class="form-select" name="리더십 및 주도성">
                <option value="">선택</option>
                <option>A+</option><option>A</option><option>B+</option><option>B</option>
                <option>C+</option><option>C</option><option>D+</option><option>D</option>
                <option>E+</option><option>E</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">평가 제출</button>
    </form>

    <p id="responseMessage" class="mt-3"></p>

    <script>
        document.getElementById("evaluationForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch("https://script.google.com/macros/s/AKfycbxkAvg0P-WZh1HVIuQ-zK-jf4dKs2j9IwxlB1j0BAoKa7j0YItWlQIDAY-PgD_3Yh-u/exec", {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById("responseMessage").textContent = "평가가 성공적으로 제출되었습니다!";
                event.target.reset();
            }).catch(error => {
                document.getElementById("responseMessage").textContent = "제출 중 오류가 발생했습니다.";
            });
        });
    </script>
    
</body>
</html>
